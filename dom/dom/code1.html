<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #para{
        background-color: gray;
        border: solid;
        border-radius: 10px;
        padding: 20px;
        font-style: bold;
        font-size: 20px;
    }
    button{
        border: solid;
        border-radius: 10px;
        padding: 10px;
        background-color: beige;
    }
</style>
<body>
    <p id="para" class="paraClass">java script</p>
    <p id="para" class="paraClass">Lorem ipsum dolor sit amet.</p>
    
    
    <button onclick="hello()">click me</button>
    <script>
        function hello(){
            let idDemo = document.getElementById("para");
        
        idDemo.innerHTML = "<h1>js</h1>";
        idDemo.style.color = "black";
        idDemo.style.backgroundColor = "gray";
        }
    </script>
</body>
