<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background-color: rgb(11, 11, 33);
    }
    .card{
    width: 300px;
    height: 400px;
    border: solid;
    margin:25%;
    border-radius: 20px;
    border-color:rgb(239, 239, 176);
    /* background:radial-gradient(circle,rgb(234, 119, 76),rgb(16, 16, 16),rgb(51, 51, 51),rgb(42, 41, 41),black); */
    background-color: rgba(47, 46, 46, 0.67);
    border-color: none;
    padding: 10px;
    position: relative;
    
    
}
.card:hover{
    box-shadow: 0px 0px 30px rgb(227, 96, 48);

}
    
img{
    width: 100px;
    margin-left: 30%;
    margin-top: 20px;
    border-radius: 20px;
    border: none;
}
.empty{
    position: absolute;
    width: 100px;
    height:100px;
    z-index: -1;
    background-color: orange;
    border-radius: 50%;
    filter: blur(20px);
    top: 40%;
    left: 35%;

}
.card h1{
    color: white;
    text-align: center;
}
.card h4{
    color: white;
    text-align: center;
    line-height: 1.4;
}
</style>

<body>
    <div class="card">
        <img src="/img/logo.png">
        <h1>web <br>development</h1>
        <div class="empty"></div>
        <h4>Lorem ipsum dolor sit amet consectetur adipisicing elit. Mollitia, Lorem ipsum dolor sit amet consectetur adipisicing elit. Iste, neque.
           
        </h4>
        <p></p>
    </div>
</body>
</html>
