  padding: 10px;

.menu{

}
.root{

width: 100%;

.para{

  left: 0px ;
  top: 0px;
  bottom: auto;
  min-width: 170px;
  border: transparent;
  
}
h4{

  margin: 10px;
}
p{

}
.hiyaButton{

}
.video video{

width: 104%;

}
.hero{

  gap: 100px;
}
.paragraph{
  font-weight: bold;

}
.btn{
  background-color: black;
  color : white;
  display: flex;
  flex-wrap: wrap;
  flex-direction: row;
  gap:20px;
}
@media only screen and (min-width:500px){
  ul{
    display: flex;
    align-items: center;
  }
  .menu{
    display: none;
  }
  button{
    display: flex;
  }
}
</style>
