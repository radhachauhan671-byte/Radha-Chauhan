<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Studio</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap");

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --lime: #d8ff3e;
      --dark: #121212;
      --white: #f7f7f2;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--dark);
      color: var(--white);
      font-family: "DM Sans", sans-serif;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Video area: replace VIDEO_URL_HERE.mp4 below */
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, rgba(10, 10, 10, 0.82) 0%, rgba(10, 10, 10, 0.30) 62%, rgba(10, 10, 10, 0.15) 100%),
        linear-gradient(0deg, rgba(10, 10, 10, 0.65) 0%, transparent 48%);
    }

    /* Navbar */
    .navbar {
      width: min(1440px, calc(100% - 64px));
      margin: 0 auto;
      padding: 27px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .logo {
      color: var(--white);
      text-decoration: none;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: var(--lime);
    }

    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      color: var(--white);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--lime);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .circle-button {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.55);
      background: transparent;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      font-size: 1.05rem;
    }

    .project-button {
      border: 0;
      border-radius: 99px;
      padding: 13px 20px;
      background: var(--lime);
      color: #111;
      text-decoration: none;
      font-size: 0.87rem;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .project-button:hover {
      transform: translateY(-2px);
      background: white;
    }

    /* Hero content */
    .hero-content {
      width: min(1440px, calc(100% - 64px));
      margin: auto;
      padding: 90px 0 62px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 40px;
    }

    .eyebrow {
      color: var(--lime);
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    .hero h1 {
      max-width: 850px;
      font-family: "Playfair Display", serif;
      font-size: clamp(3.8rem, 8.2vw, 8.6rem);
      font-weight: 600;
      line-height: 0.88;
      letter-spacing: -0.07em;
    }

    .hero h1 em {
      color: var(--lime);
      font-weight: 600;
    }

    .hero-copy {
      max-width: 265px;
      font-size: 1rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.88);
      margin-bottom: 12px;
    }

    .scroll-note {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(255,255,255,0.8);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .scroll-line {
      width: 40px;
      height: 1px;
      background: var(--lime);
    }

    .menu-toggle {
      display: none;
    }

    @media (max-width: 800px) {
      .navbar,
      .hero-content {
        width: min(100% - 36px, 1440px);
      }

      .navbar {
        padding: 20px 0;
      }

      .nav-links,
      .project-button {
        display: none;
      }

      .menu-toggle {
        display: block;
      }

      .hero-content {
        grid-template-columns: 1fr;
        padding: 100px 0 80px;
        gap: 26px;
      }

      .hero h1 {
        font-size: clamp(3.3rem, 17vw, 5.5rem);
      }

      .hero-copy {
        max-width: 310px;
      }
    }
  </style>
</head>

<body>
  

    <nav class="navbar">
      <a href="#" class="logo">your<span>studio</span>.</a>

      <ul class="nav-links">
        <li><a href="#services">Services</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#journal">Journal</a></li>
      </ul>

      <div class="nav-right">
        <button class="circle-button" aria-label="Toggle dark mode">◐</button>
        <a class="project-button" href="#contact">Start a project ↗</a>
        <button class="circle-button menu-toggle" aria-label="Open menu">☰</button>
      </div>
    </nav>
    

    <section class="hero-content">
      <div>
        <p class="eyebrow">HELLO, WE ARE YOURSTUDIO ✦</p>
        <h1>
          We make brands<br />
          and <em>digital</em><br />
          experiences.
        </h1>
      </div>

      <p class="hero-copy">
        A creative studio helping ambitious businesses look good, sound right,
        and grow with confidence.
      </p>
    </section>

    <div class="scroll-note">
      <span class="scroll-line"></span>
      Scroll to explore
    </div>
  </main>
  <main class="hero">

      <source src="VIDEO_URL_HERE.mp4" type="video/mp4" />
      Your browser does not support video.
    </video>

    <div class="video-overlay"></div>
</body>
</html>
