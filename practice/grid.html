<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        
        gap:10px;
        display: grid;
        grid-template-columns: 100px 100px 100px;
        grid-template-rows: repeat(3, 200px);
        /* grid-template-columns: 1fr; */
        grid-template-columns: 2fr 1fr;

    }
.box{
    
    background-color: aqua;
    margin-top: 10px;
    
}
</style>
<body>
    <div class="container">

    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
    <div class="box">9</div>

    </div>
    
</body>
</html>
