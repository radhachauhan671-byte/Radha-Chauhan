<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

.mainbox{
background-color: rgb(0, 128, 255);
color: white;
height: 400px;
width:300px;
display: flex;
flex-direction: column;
gap: 10px;
position: relative;


}
.box1{
    backdrop-filter: blur;
    background-color: rgb(151, 48, 99);
    width: 100px;
    height: 100px;
    position: absolute;
    /* z-index: -1; */
    right: 0;
    bottom: 0;
    

}


.box2{
    backdrop-filter: blur;
    background-color: rgb(198, 88, 52);
    width: 100px;
    height: 100px;

}
.box3{
    backdrop-filter: blur;
    background-color: rgb(47, 190, 44);
    width: 100px;
    height: 100px;

}
.box4{
    backdrop-filter: blur;
    background-color: rgb(232, 43, 46);
    width: 100px;
    height: 100px;

}


</style>
<body>
    <div class="mainbox">
<div class="box">
<div class="box box1">1</div>
<div class="box box2">2</div>
<div class="box box3">3</div>
<div class="box box4">4</div>
</div>
    </div>
</body>
</html>
