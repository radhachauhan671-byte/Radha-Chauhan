<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bulb on off</title>
<style>
    body{
        background-color: black;
        text-align: center;
    }
#bulb{
    width: 300px;
    height:auto;
    margin-top: 50px;
}

</style>
</head>
<body>
    <img src="/img/bulb.png" id="bulb" onclick="bulbOn()">
    
    <script>
        function bulbOn(){
            document.getElementById("bulb");
            bulb.style.filter = "sepia(3) saturate(5) brightness(1)";
            bulb.style.boxShadow = "0 0 50px yellow";
        }
    </script>
</body>
</html>
