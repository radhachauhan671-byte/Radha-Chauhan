<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <style>
        *{
            margin:0;
            padding:0;
            background-color:none;
            margin-top: 50px;
            margin-left: 50px;
        }
        .div{
            border:solid;
            padding: 40px;
            border-radius: 20px;
            height: 200px;
            background-color: rgb(48, 38, 79);



        }
       
        button{
            width:100px;
            height:50px;
            border: solid;
            border-radius: 20px;
            background-color: rgb(198, 198, 205);
            font-weight: bold;

        }
        span{
              width:100px;
            height:50px;
            font-size: 40px;
            font-weight: bold;
        }
        
    </style>
</head>
<body><div class="div">
   <span id="hours">00</span>:
   <span id="minutes">00</span>:
   <span id="seconds">00</span>
   <br>

   <button onclick="Start()">start</button>
   <button onclick="Stop()">stop</button>
   <button onclick="Reset()">Reset</button>
</div>
   <script>
    let totalSeconds = 0;
    let timer = null;

    function pad(num){
        return num < 10 ? "0" + num : num;
    }

    function updateDisplay(){
        let hrs = Math.floor(totalSeconds / 3600);
        let mins = Math.floor((totalSeconds % 3600) / 60);
        let secs = totalSeconds % 60;

        document.getElementById("hours").textContent = pad(hrs);
        document.getElementById("minutes").textContent = pad(mins);
        document.getElementById("seconds").textContent = pad(secs);
    }

    function Start(){
        if(timer === null){
            timer = setInterval(function(){
                totalSeconds++;
                updateDisplay();
            }, 1000);
        }
    }

    function Stop(){
        clearInterval(timer);
        timer = null;
    }

    function Reset(){
        Stop();
        totalSeconds = 0;
        updateDisplay();
    }
   </script>
</body>
</html>
