<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="box">
    <h2>contact form</h2>
 <form>
    <input type="text" id="name" placeholder="enter your name">
    <br><br>
    <input type="email" id="email" placeholder="enter your email id">
    <br><br>
    <button type="button" onclick="submitForm()">submit</button>
    <button type="button" onclick="resetForm()">reset form</button> 
     <p id="msg"></p>

</form>
</div>
 <script> 
 const box = document.querySelector(".box");

 box.style.backgroundColor = "pink";
 box.style.border = "2px solid red";
box.style.borderRadius = "20px";
box.style.padding = "20px";
box.style.width = "200px";
box.style.height = "300px";
box.style.margin = "30px auto";
 
 
 
 
  function submitForm() {
    let name = document.querySelector("#name").value;
    let email = document.querySelector("#email").value;
    let msg  = document.querySelector("#msg");
    msg.style.fontSize = "20px";
    msg.style.fontWeight = "bold";
    



    if(name == "" || email == ""){
        document.querySelector("#msg").innerHTML =
        "please fill all details";
        msg.style.color = "red";
        msg.style.backgroundColor = "lightpink";
        msg.style.padding = "10px";
        msg.style.border = "1px solid";
        msg.style.borderRadius = "10px";

    }else{
        document.querySelector("#msg").innerHTML =
        "form submitted" + name + "-" + email;
        msg.style.color = "green";
        msg.style.backgroundColor = "lightgreen";
        msg.style.padding = "10px";


    }
 }
 function resetForm(){
    document.querySelector("#name").value = "";
    document.querySelector("#email").value = "";
    let msg = document.querySelector("#msg");
    msg.innerHTML = "form reset";

    msg.style.color = "blue";
    msg.style.backgroundColor = "lightblue";
    msg.style.padding = "10px";

 }
 </script>
</body>
</html>
