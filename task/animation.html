<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.mainBox{
        width: 300px;
        height:300px;
        margin: 25%;
        align-items: center;
        background-color: rgb(8, 8, 8);
         animation: box 5s infinite alternate-reverse;
    }
@keyframes box {
    
    0%{background-color: orangered;}
    15%{background-color: rgb(43, 168, 14);}
    25%{background-color: white;}
    35%{background-color: orange;}
    45%{background-color: green;}
    55%{background-color: blue;}
    65%{background-color: blueviolet;}
    85%{background-color: pink;}
    95%{background-color: red;}
    100%{background-color:yellow;}
}

</style>
<body>
    <div class="mainBox"></div>
</body>
</html>
